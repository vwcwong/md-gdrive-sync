name: sync

on:
  schedule:
    # Daily. Offset from the hour because scheduled runs bunch up on the hour
    # and get delayed.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render documents but do not publish to Drive"
        type: boolean
        default: false
  push:
    branches: [main]
    # Only a config change needs to sync promptly; code changes wait for the
    # schedule or a manual run.
    paths: ["repos.yml"]

# Nothing is written back to this repository: Drive document IDs are recovered
# by name each run, so there is no state file to commit.
permissions:
  contents: read

# Two runs must not race the same Drive documents. Queue rather than cancel, so
# a scheduled run is not dropped by a manual one.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  sync:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build this commit rather than downloading a release, so a scheduled
      # run always matches the tree it is running from.
      - uses: ./
        with:
          version: source
          dry-run: ${{ inputs.dry_run == true }}
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Fine-grained PAT with read-only contents access to the notes repos.
          NOTES_REPO_TOKEN: ${{ secrets.NOTES_REPO_TOKEN }}

      # out/ is discarded with the runner. Uploading it would publish the
      # contents of private notes repos to anyone who can see the workflow.
