drive:
  folder_id: ${GDRIVE_FOLDER_ID}
  combined_doc_name: "Notes — All Repos"
  emit_combined: true
  emit_per_repo: true
  prune_orphans: true
  max_chars_per_doc: 900000

defaults:
  branch: null
  include:
    - "**/*.md"
    - "**/*.markdown"
  exclude:
    - "node_modules/**"
    - ".github/**"
    - "**/CHANGELOG.md"
    - "**/LICENSE.md"
  strip_frontmatter: true

repos:
  - url: https://github.com/vwcwong/COMP9315
    name: "COMP9315 - Database Systems Implementation"
