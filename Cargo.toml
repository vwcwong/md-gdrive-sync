[package]
name = "mdsync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
globset = "0.4.20"
ignore = "0.4.33"
jiff = "0.2.35"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "http2", "charset", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.2.0"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = "1.48.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
